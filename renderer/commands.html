<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>命令速查 — Claude Panel</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, 'Segoe UI', sans-serif;
    background: #f5f5f7;
    display: flex;
    height: 100vh; overflow: hidden;
  }
  .app {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 10px;
    padding: 20px;
    background: #f5f5f7;
    flex: 1; min-height: 0;
  }
  .topbar {
    background: #ffffff;
    border-radius: 12px;
    padding: 10px 20px;
    display: flex;
    align-items: center;
    box-shadow: 0 1px 4px rgba(0,0,0,0.04);
    font-size: 14px;
  }
  .topbar .sep { color: #ddd; margin: 0 8px; }
  .topbar .nav-links { margin-left: auto; display: flex; gap: 12px; }
  .topbar .nav-links a {
    text-decoration: none;
    color: #888;
    padding: 2px 10px;
    border-radius: 6px;
    transition: all 0.15s;
  }
  .topbar .nav-links a:hover {
    background: #e8f0ff;
    color: #4a90d9;
  }
  .topbar .nav-links a.active {
    background: #4a90d9;
    color: #fff;
  }
  .main-row { display: flex; gap: 16px; min-width: 0; flex: 1; min-height: 0; }
  .left-panel {
    flex: 1; min-width: 0;
    background: #ffffff;
    border-radius: 14px;
    padding: 24px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.04);
    display: flex;
    flex-direction: column;
    min-height: 0; overflow: hidden;
  }
  .panel-header {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 18px;
    padding-bottom: 16px;
    border-bottom: 1px solid #f0f0f5;
    flex-shrink: 0;
  }
  .panel-header .icon { font-size: 22px; color: #555; }
  .panel-header .title { font-size: 18px; font-weight: 600; color: #1a1a2e; }
  .panel-header .tag {
    background: #e8f0ff; color: #4a90d9;
    border-radius: 8px; padding: 4px 16px; font-size: 14px;
  }
  .panel-header .count {
    margin-left: auto;
    background: #f5f5f7; color: #888;
    border-radius: 8px; padding: 4px 16px; font-size: 14px;
  }
  .sidebar {
    width: 220px; flex-shrink: 0;
    display: flex; flex-direction: column; gap: 12px; min-height: 0;
  }
  .side-card {
    height: 220px; flex-shrink: 0;
    background: #ffffff;
    border-radius: 12px;
    padding: 16px 18px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.04);
    cursor: pointer;
    display: flex;
    flex-direction: column;
    text-decoration: none;
    transition: box-shadow 0.15s;
  }
  .side-card:hover { box-shadow: 0 2px 10px rgba(74,144,217,0.12); }
  .side-card .shead {
    display: flex; align-items: center; gap: 6px; margin-bottom: 12px;
  }
  .side-card .shead .sicon { font-size: 16px; color: #888; }
  .side-card .shead .stitle { font-size: 14px; font-weight: 600; color: #1a1a2e; }
  .side-card .shead .sbadge {
    margin-left: auto; background: #f5f5f7; color: #888;
    border-radius: 4px; padding: 0 8px; font-size: 14px;
  }
  .side-card .sbody { font-size: 14px; color: #888; line-height: 1.6; }
  .side-card .sbody .v { color: #666; }
  .side-card .sfoot {
    margin-top: auto; padding-top: 8px;
    font-size: 14px; color: #4a90d9; font-weight: 500;
  }
  /* 命令搜索区 */
  .cmd-scroll::-webkit-scrollbar { width: 5px; }
  .cmd-scroll::-webkit-scrollbar-track { background: transparent; }
  .cmd-scroll::-webkit-scrollbar-thumb { background: #d0d0d8; border-radius: 3px; }
  .cmd-scroll::-webkit-scrollbar-thumb:hover { background: #bbb; }
  .search-box {
    position: relative; margin-bottom: 8px;
  }
  .search-box .icon {
    position: absolute; left: 14px; top: 50%;
    transform: translateY(-50%); font-size: 14px; color: #999;
  }
  .search-box input {
    width: 100%; padding: 10px 14px 10px 40px;
    border: 1px solid #e4e4ee; border-radius: 10px;
    font-size: 14px; color: #aaa; background: #ffffff;
    outline: none; font-family: inherit; box-sizing: border-box;
  }
  .cmd-item {
    display: flex; align-items: center; gap: 10px;
    padding: 6px 10px; border-radius: 6px;
    border: 1px solid #eeeef4; background: #ffffff;
    transition: background 0.1s;
  }
  .cmd-item:hover { background: #f8f8fc; }
  .cmd-item .cmd {
    font-size: 14px; font-weight: 500; color: #1a1a2e;
    font-family: monospace; display: inline-block; min-width: 150px;
  }
  .cmd-item .desc { font-size: 14px; color: #888; }
  .cmd-item .icon { font-size: 14px; color: #888; }
</style>
<script>
let allCommands = [];

async function loadCommands() {
  try {
    const resp = await fetch('/api/commands');
    allCommands = await resp.json();
    renderCommands(allCommands);
    document.getElementById('cmd-count').textContent = `共 ${allCommands.length} 条命令`;
    if (document.getElementById('cmd-search').value) {
      filterCommands();
    }
  } catch(e) {
    console.error('加载命令失败:', e);
  }
}

function renderCommands(cmds) {
  const container = document.querySelector('.cmd-scroll');
  if (cmds.length === 0) {
    container.innerHTML = '<div style="text-align:center;color:#bbb;padding:40px;">没有匹配的命令</div>';
    return;
  }
  container.innerHTML = cmds.map(c =>
    `<div class="cmd-item" data-id="${c.id}">
      <span class="icon">${c.icon}</span>
      <span class="cmd">${c.name}</span>
      <span class="desc">${c.desc}</span>
      <span style="margin-left:auto;color:#ccc;cursor:pointer;font-size:14px"
            onclick="deleteCommand(${c.id})" title="删除">✕</span>
    </div>`
  ).join('');
}

function filterCommands() {
  const kw = document.getElementById('cmd-search').value.trim().toLowerCase();
  if (!kw) {
    renderCommands(allCommands);
    document.getElementById('cmd-count').textContent = `共 ${allCommands.length} 条命令`;
    return;
  }
  const filtered = allCommands.filter(c =>
    c.name.toLowerCase().includes(kw) || c.desc.toLowerCase().includes(kw)
  );
  renderCommands(filtered);
  document.getElementById('cmd-count').textContent = `匹配 ${filtered.length} / ${allCommands.length} 条`;
}

async function addCommand() {
  const name = prompt('请输入命令名（如 /xxx）：');
  if (!name || !name.trim()) return;
  const desc = prompt('请输入命令描述：（可选）', '') || '';
  const icon = prompt('请输入图标字符：（可选，默认 🔧）', '🔧') || '🔧';
  try {
    const resp = await fetch('/api/commands', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({name: name.trim(), desc: desc.trim(), icon: icon.trim()})
    });
    if (resp.ok) {
      document.getElementById('cmd-search').value = '';
      loadCommands();
    }
  } catch(e) {
    console.error('添加命令失败:', e);
  }
}

async function deleteCommand(id) {
  if (!confirm('确定删除这条命令？')) return;
  try {
    await fetch('/api/commands/' + id, {method: 'DELETE'});
    loadCommands();
  } catch(e) {
    console.error('删除命令失败:', e);
  }
}

window.addEventListener('DOMContentLoaded', loadCommands);
</script>
</head>
<body>
<div class="app">
  <!-- 顶部条（含子页面导航，无返回主页） -->
  <div class="topbar">
    <span style="color:#888;">📁</span>
    <span style="color:#888; margin-left:8px;">Claude Code Panel</span>
    <span class="sep">|</span>
    <span style="color:#888;">v0.8.0</span>
    <span class="sep">|</span>
    <span style="color:#888;">claude-sonnet-4-6</span>
    <span class="nav-links">
      <a href="index.html">🏠 主页</a>
      <a href="skills.html">🧩 技能管理</a>
      <a href="env.html">📁 环境详情</a>
    </span>
  </div>

  <!-- 一主二副 -->
  <div class="main-row">

    <!-- 左侧：命令速查（展开） -->
    <div class="left-panel">
      <div class="panel-header">
        <span class="icon">⚡</span>
        <span class="title">命令速查</span>
        <span class="tag">当前</span>
        <span class="count" id="cmd-count" style="margin-left:auto;margin-right:8px;">共 0 条命令</span>
        <button onclick="addCommand()" style="background:#4a90d9; color:#fff; border:none; border-radius:8px; padding:6px 16px; font-size:14px; cursor:pointer; font-family:inherit; transition: transform 0.1s;" onmousedown="this.style.transform='scale(0.95)'" onmouseup="this.style.transform='scale(1)'" onmouseleave="this.style.transform='scale(1)'">＋ 添加命令</button>
        <button onclick="loadCommands()" style="background:#28a745; color:#fff; border:none; border-radius:8px; padding:6px 16px; font-size:14px; cursor:pointer; font-family:inherit; transition: transform 0.1s;" onmousedown="this.style.transform='scale(0.95)'" onmouseup="this.style.transform='scale(1)'" onmouseleave="this.style.transform='scale(1)'">🔄 刷新</button>
      </div>

      <!-- 搜索框 + 列表 -->
      <div style="display:flex; flex-direction:column; gap:8px; flex:1; min-height:0;">
        <div style="background:#f8f8fc; border-radius:10px; padding:14px 16px; border:1px solid #eeeef4; display:flex; flex-direction:column; flex:1; min-height:0;">
          <div class="search-box">
            <span class="icon">🔍</span>
            <input id="cmd-search" type="text" placeholder="输入关键词模糊搜索..." oninput="filterCommands()">
          </div>
          <div class="cmd-scroll" style="display:flex; flex-direction:column; gap:3px; overflow-y:auto; flex:1; min-height:0; padding-right:2px; margin-top:8px;">
          </div>
        </div>
      </div>
    </div>

    <!-- 右侧：折叠模块 -->
    <div class="sidebar">
      <a class="side-card" href="env.html">
        <div class="shead">
          <span class="sicon">📁</span>
          <span class="stitle">环境详情</span>
        </div>
        <div class="sbody">
          路径：<span class="v">C:\Users\...</span><br>
          版本：<span class="v">v0.8.0</span><br>
          模型：<span class="v">claude-sonnet-4-6</span><br>
          系统：<span class="v">Windows 11</span><br>
          时长：<span class="v">1h 23m</span>
        </div>
        <div class="sfoot">点击切换 →</div>
      </a>

      <a class="side-card" href="skills.html">
        <div class="shead">
          <span class="sicon">🧩</span>
          <span class="stitle">技能管理</span>
          <span class="sbadge">8</span>
        </div>
        <div class="sbody">
          💡 <span class="v">brainstorming</span><br>
          🐛 <span class="v">debugging</span><br>
          🧪 <span class="v">TDD</span><br>
          📋 <span class="v">code-review</span><br>
          📝 <span class="v">documentation</span>
        </div>
        <div class="sfoot">点击切换 →</div>
      </a>
    </div>

  </div>
</div>
</body>
</html>
